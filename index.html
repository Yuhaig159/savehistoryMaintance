<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Cập Nhật Bảo Dưỡng - Trạm Kiểm Duyệt</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">

    <style>
        body { font-family: system-ui, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 800px; } /* Mở rộng form để dễ nhìn review */
        
        .form-group { margin-bottom: 15px; flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #1f4e78; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px;}
        input:focus { border-color: #1f4e78; outline: none; box-shadow: 0 0 0 2px rgba(31,78,120,0.2); }
        
        /* Box chứa từng hạng mục công việc */
        .item-box { border: 2px solid #e2e8f0; padding: 15px; margin-bottom: 20px; background: #fff; border-radius: 8px; position: relative;}
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .item-title { font-weight: bold; color: #2d3748; }
        
        /* Box Review Mapping */
        .mapping-box { background: #f8fbff; padding: 15px; border-radius: 6px; margin-top: 15px; border: 1px dashed #90cdf4; }
        .mapping-title { font-size: 13px; color: #2b6cb0; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 5px;}
        .flex-row { display: flex; gap: 12px; }
        
        /* Cảnh báo khi chưa có dữ liệu mapping */
        .warning-input { background-color: #fefcbf; border-color: #d69e2e !important; }
        
        button { background: #1f4e78; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.2s; font-weight: bold;}
        button:hover { background: #2b6cb0; }
        button:disabled { background: #a0aec0; cursor: not-allowed; }
        
        .btn-add { background: #48bb78; margin-bottom: 15px; }
        .btn-add:hover { background: #38a169; }
        .btn-scan { background: #e67e22; margin-top: 15px;}
        .btn-scan:hover { background: #d35400; }
        .btn-delete { background: #fc8181; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; width: auto; margin: 0; }
        .btn-delete:hover { background: #e53e3e; }
        .btn-add-map { background: #ed8936; color: white; border: none; padding: 8px; width: auto; border-radius: 4px; font-size: 13px; margin-top: 10px; cursor: pointer; }
        .btn-add-map:hover { background: #dd6b20; }
        
        #status, #scanStatus { margin-top: 15px; text-align: center; font-weight: bold; }
        
        .upload-section { border: 2px dashed #1f4e78; padding: 20px; text-align: center; border-radius: 8px; background: #eef2f5; margin-bottom: 25px; }
        .upload-section input[type="file"] { border: none; padding: 0; background: transparent; font-size: 15px; }
    </style>
</head>
<body>

<datalist id="heThongList"></datalist>
<datalist id="hangMucList"></datalist>
<datalist id="loaiVatTuList"></datalist>

<div class="card">
    <h2 style="text-align: center; color: #1f4e78;">📝 TRẠM QUÉT & KIỂM DUYỆT BẢO DƯỠNG</h2>
    
    <div class="upload-section">
        <label style="font-size: 16px;">📥 Tải lên Báo giá / Hóa đơn (PDF hoặc Ảnh):</label>
        <input type="file" id="fileInput" accept=".pdf, image/*">
        <button class="btn-scan" id="btnScan" onclick="scanDocument()">✨ BƯỚC 1: QUÉT & TỰ ĐỘNG ÁNH XẠ (AI)</button>
        <div id="scanStatus" style="display: none; color: #e67e22;">⏳ AI đang bóc tách và đối chiếu dữ liệu Mapping, vui lòng đợi...</div>
    </div>
    
    <div style="background: #f7fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e2e8f0;">
        <h4 style="margin-top: 0; color: #4a5568; border-bottom: 1px solid #cbd5e0; padding-bottom: 5px;">Thông tin chung</h4>
        <div class="flex-row">
            <div class="form-group"><label>Biển Số Xe:</label><input type="text" id="bienSo" placeholder="VD: 51K - 529.01"></div>
            <div class="form-group"><label>Đơn Vị Thực Hiện:</label><input type="text" id="donVi" placeholder="VD: Toyota Tân Cảng"></div>
        </div>
        <div class="flex-row">
            <div class="form-group"><label>Ngày:</label><input type="date" id="ngay"></div>
            <div class="form-group"><label>Số Km:</label><input type="number" id="soKm" placeholder="VD: 55000"></div>
        </div>
    </div>

    <h4 style="color: #4a5568; border-bottom: 2px solid #1f4e78; padding-bottom: 5px;">Danh sách Chi tiết (Review trước khi lưu)</h4>
    <div id="itemsContainer">
        </div>
    
    <button class="btn-add" onclick="addItem()">+ Thêm dòng thủ công</button>
    <button onclick="submitData()">🚀 BƯỚC 2: XÁC NHẬN ĐÚNG & LƯU VÀO SHEET DATA</button>
    <div id="status"></div>
</div>

<script>
    // DÁN ĐƯỜNG LINK WEB APP CỦA BẠN VÀO ĐÂY
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwLJldZEMrWFq13VyJ24rFuyxwp47hM4GzciSSr_rbCJlgkisTkSoeiVv_ggzKos79o/exec";
    
    // Biến lưu trữ từ điển Mapping
    let dictRules = []; 

    // TẢI TỪ ĐIỂN MAPPING NGAY KHI MỞ WEB
    window.onload = function() {
        document.getElementById('itemsContainer').innerHTML = ''; 
        addItem(); // Tạo sẵn 1 dòng trống
        
        const statusEl = document.getElementById("status");
        statusEl.innerText = "⏳ Đang kết nối và tải cơ sở dữ liệu Mapping...";
        statusEl.style.color = "#e67e22";
        
        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "get_mapping" })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                dictRules = data.data.rules || [];
                // Sắp xếp từ khóa dài lên trước để match chính xác hơn
                dictRules.sort((a, b) => b.keyword.length - a.keyword.length); 
                populateDatalists(dictRules);
                statusEl.innerText = "";
            }
        })
        .catch(err => {
            statusEl.innerText = "⚠️ Chưa lấy được dữ liệu Mapping từ Sheets.";
        });
    };

    // ĐỔ DỮ LIỆU VÀO DROPDOWN
    function populateDatalists(rules) {
        let heThongSet = new Set(), hangMucSet = new Set(), loaiVatTuSet = new Set();
        rules.forEach(r => {
            if(r.heThong) heThongSet.add(r.heThong);
            if(r.hangMuc) hangMucSet.add(r.hangMuc);
            if(r.loaiVatTu) loaiVatTuSet.add(r.loaiVatTu);
        });
        document.getElementById('heThongList').innerHTML = [...heThongSet].map(v => `<option value="${v}">`).join('');
        document.getElementById('hangMucList').innerHTML = [...hangMucSet].map(v => `<option value="${v}">`).join('');
        document.getElementById('loaiVatTuList').innerHTML = [...loaiVatTuSet].map(v => `<option value="${v}">`).join('');
    }

    // LOGIC TỰ ĐỘNG ÁNH XẠ TRÊN GIAO DIỆN
    function autoMap(keyword) {
        if(!keyword) return { heThong: "", hangMuc: "", loaiVatTu: "" };
        let lowerKw = keyword.toLowerCase().trim();
        for(let r of dictRules) {
            if(lowerKw.includes(r.keyword)) {
                return { heThong: r.heThong, hangMuc: r.hangMuc, loaiVatTu: r.loaiVatTu };
            }
        }
        // Trả về rỗng nếu không tìm thấy để bôi vàng cảnh báo người dùng
        return { heThong: "", hangMuc: "", loaiVatTu: "" };
    }

    // XỬ LÝ KHI NGƯỜI DÙNG GÕ TAY VÀO Ô "CHI TIẾT"
    function handleTypingChiTiet(inputEl) {
        const box = inputEl.closest('.item-box');
        const mapped = autoMap(inputEl.value);
        
        const htInput = box.querySelector('.map-heThong');
        const hmInput = box.querySelector('.map-hangMuc');
        const vtInput = box.querySelector('.map-loaiVatTu');
        
        htInput.value = mapped.heThong;
        hmInput.value = mapped.hangMuc;
        vtInput.value = mapped.loaiVatTu;
        
        // Kiểm tra và bôi màu cảnh báo
        checkWarning(htInput); checkWarning(hmInput); checkWarning(vtInput);
        
        // Hiện nút Lưu mapping nếu người dùng muốn lưu quy tắc mới
        box.querySelector('.btn-add-map').style.display = 'inline-block';
    }

    // HÀM KIỂM TRA ĐỂ BÔI MÀU CẢNH BÁO
    function checkWarning(el) {
        if(el.value.trim() === "") {
            el.classList.add("warning-input");
            el.placeholder = "⚠️ Chọn/Nhập dữ liệu";
        } else {
            el.classList.remove("warning-input");
        }
    }

    // THÊM 1 DÒNG VÀO BẢNG (Dùng cho cả tạo thủ công và AI nhúng vào)
    function addItem(itemData = null) {
        const container = document.getElementById('itemsContainer');
        const box = document.createElement('div');
        box.className = 'item-box';
        
        const chiTiet = itemData ? (itemData.ten || '') : '';
        const soLuong = itemData ? (itemData.sl || 1) : 1;
        const tongTien = itemData ? (soLuong * (itemData.gia || 0)) : '';
        const donVi = itemData ? (itemData.dv || 'Cái') : 'Cái';
        
        // Chạy Logic Mapping lập tức
        let mapped = autoMap(chiTiet);

        box.innerHTML = `
            <div class="item-header">
                <span class="item-title">🔹 Nội dung Hãng ghi</span>
                <button type="button" class="btn-delete" onclick="this.closest('.item-box').remove()">🗑️ Bỏ hạng mục này</button>
            </div>
            
            <div class="form-group"><input type="text" class="chiTiet" value="${chiTiet}" placeholder="VD: Nhớt máy 5W-30" oninput="handleTypingChiTiet(this)"></div>
            <div class="flex-row">
                <div class="form-group"><label>Số lượng:</label><input type="number" class="soLuong" value="${soLuong}" step="0.1"></div>
                <div class="form-group"><label>Tổng tiền:</label><input type="number" class="tongTien" value="${tongTien}" placeholder="VNĐ"></div>
            </div>

            <div class="mapping-box">
                <div class="mapping-title">🔍 Kết quả Ánh xạ vào Hệ thống:</div>
                <div class="flex-row">
                    <div class="form-group">
                        <label>Hệ thống</label>
                        <input type="text" class="map-heThong ${mapped.heThong ? '' : 'warning-input'}" list="heThongList" value="${mapped.heThong}" placeholder="Chọn/Nhập" onchange="checkWarning(this)">
                    </div>
                    <div class="form-group">
                        <label>Tên hạng mục</label>
                        <input type="text" class="map-hangMuc ${mapped.hangMuc ? '' : 'warning-input'}" list="hangMucList" value="${mapped.hangMuc}" placeholder="Chọn/Nhập" onchange="checkWarning(this)">
                    </div>
                    <div class="form-group">
                        <label>Loại vật tư</label>
                        <input type="text" class="map-loaiVatTu ${mapped.loaiVatTu ? '' : 'warning-input'}" list="loaiVatTuList" value="${mapped.loaiVatTu}" placeholder="Chọn/Nhập" onchange="checkWarning(this)">
                    </div>
                </div>
                <div style="text-align: right;">
                    <button type="button" class="btn-add-map" onclick="addNewMapping(this)">💾 Dạy AI: Lưu từ khóa này vào Mapping</button>
                </div>
            </div>

            <input type="hidden" class="donViTinh" value="${donVi}">
            <input type="hidden" class="phanLoai" value="Mua sắm">
        `;
        container.appendChild(box);
    }

    // CHỨC NĂNG: NẠP TỪ KHÓA MỚI VÀO MAPPING SHEET
    function addNewMapping(btn) {
        const box = btn.closest('.item-box');
        const keyword = box.querySelector('.chiTiet').value.trim();
        const heThong = box.querySelector('.map-heThong').value.trim();
        const hangMuc = box.querySelector('.map-hangMuc').value.trim();
        const loaiVatTu = box.querySelector('.map-loaiVatTu').value.trim();

        if(!keyword || !heThong || !hangMuc) { 
            alert("⚠️ Vui lòng điền đủ Chi tiết công việc, Hệ thống và Tên hạng mục trước khi lưu Mapping!"); 
            return; 
        }
        
        btn.innerText = "⏳ Đang lưu...";
        btn.disabled = true;

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: "add_mapping",
                keyword: keyword,
                heThong: heThong,
                hangMuc: hangMuc,
                loaiVatTu: loaiVatTu
            })
        })
        .then(r => r.json())
        .then(res => {
            if(res.status === "success") {
                btn.innerText = "✅ Đã lưu vào Cơ sở dữ liệu Mapping";
                btn.style.background = "#38a169";
                
                // Cập nhật bộ nhớ tạm
                dictRules.push({ keyword: keyword.toLowerCase(), heThong, hangMuc, loaiVatTu });
                dictRules.sort((a, b) => b.keyword.length - a.keyword.length);
                populateDatalists(dictRules);
                
                // Tắt highlight vàng
                checkWarning(box.querySelector('.map-heThong'));
                checkWarning(box.querySelector('.map-hangMuc'));
                checkWarning(box.querySelector('.map-loaiVatTu'));
            } else { throw new Error(res.message); }
        })
        .catch(e => {
            btn.innerText = "❌ Lỗi: Chưa kết nối được";
            btn.style.background = "#e53e3e";
            btn.disabled = false;
        });
    }

    // QUÉT TÀI LIỆU BẰNG AI
    function scanDocument() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) { alert("Vui lòng chọn file trước khi bấm quét!"); return; }

        const file = fileInput.files[0];
        const scanStatus = document.getElementById('scanStatus');
        const btnScan = document.getElementById('btnScan');
        
        scanStatus.style.display = "block";
        btnScan.disabled = true;

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Content = e.target.result.split(',')[1];
            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "analyze_pdf", fileBase64: base64Content, mimeType: file.type })
            })
            .then(res => res.json())
            .then(data => {
                scanStatus.style.display = "none";
                btnScan.disabled = false;

                if (data.status === "error") { alert("❌ Lỗi trích xuất AI: " + data.message); return; }

                const result = data.data;
                document.getElementById('bienSo').value = result.header.bien_so || '';
                document.getElementById('donVi').value = result.header.don_vi_sua_chua || '';
                document.getElementById('ngay').value = result.header.ngay || '';
                document.getElementById('soKm').value = result.header.so_km || '';

                const container = document.getElementById('itemsContainer');
                container.innerHTML = ''; // Làm sạch các ô hiện tại
                
                if (result.hang_muc && result.hang_muc.length > 0) {
                    // Gọi hàm addItem để render từng ô và kích hoạt Auto-Mapping lập tức
                    result.hang_muc.forEach(item => addItem(item));
                } else { 
                    addItem(); 
                }
                
                alert("✅ AI đã quét xong! Các ô bôi VÀNG là các hạng mục AI chưa biết phân loại. Vui lòng kiểm tra và sửa lại trước khi gửi lưu.");
            })
            .catch(err => {
                scanStatus.style.display = "none";
                btnScan.disabled = false;
                alert("❌ Lỗi kết nối AI: " + err.message);
            });
        };
        reader.readAsDataURL(file);
    }

    // GỬI DATA CUỐI CÙNG LƯU VÀO SHEET (Lấy Data chính xác từ Review)
    function submitData() {
        const statusEl = document.getElementById("status");
        const items = [];
        
        document.querySelectorAll('.item-box').forEach(box => {
            let chiTiet = box.querySelector('.chiTiet').value;
            if (chiTiet) {
                items.push({
                    chiTiet: chiTiet,
                    soLuong: box.querySelector('.soLuong').value || 1,
                    tongTien: box.querySelector('.tongTien').value || 0,
                    donViTinh: box.querySelector('.donViTinh').value,
                    phanLoai: box.querySelector('.phanLoai').value,
                    // Lấy chính xác dữ liệu từ form kiểm duyệt
                    heThong: box.querySelector('.map-heThong').value || "Chưa phân loại",
                    hangMuc: box.querySelector('.map-hangMuc').value || "Chưa phân loại",
                    loaiVatTu: box.querySelector('.map-loaiVatTu').value || "Chưa phân loại"
                });
            }
        });

        if (items.length === 0) { alert("Vui lòng có ít nhất 1 chi tiết công việc để lưu!"); return; }

        const payload = {
            action: "save", 
            bienSo: document.getElementById('bienSo').value,
            donVi: document.getElementById('donVi').value,
            ngay: document.getElementById('ngay').value,
            soKm: document.getElementById('soKm').value,
            items: items
        };

        statusEl.style.color = "#1f4e78";
        statusEl.innerText = "⏳ Đang ghi dữ liệu vào Google Sheets...";

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                statusEl.style.color = "green";
                statusEl.innerText = "✅ HOÀN TẤT! Dữ liệu của bạn đã được lưu chuẩn xác vào Sheet.";
                // Xóa trắng form để làm xe tiếp theo
                document.querySelectorAll('input:not([type="hidden"])').forEach(input => input.value = '');
                document.getElementById('itemsContainer').innerHTML = '';
                addItem(); 
            } else {
                statusEl.style.color = "red";
                statusEl.innerText = "❌ Lỗi: " + data.message;
            }
        }).catch(err => {
            statusEl.style.color = "red";
            statusEl.innerText = "❌ Lỗi kết nối Google Sheets.";
        });
    }
</script>
</body>
</html>
